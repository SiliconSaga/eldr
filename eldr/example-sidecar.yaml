# eldr/example-sidecar.yaml — Refrhus starting point; refine as the house is measured.
design:
  indoor_heating_f: 70        # winter setpoint
  # outdoor_heating_99_f:     # omitted -> looked up from the model's lat/long (nearest station).
  #                           # Set it here to override with your exact ACCA design temp.
  supply_air_rise_f: 50       # supply-air temperature rise over room, for CFM sizing
  ground_temp_f: 50           # deep-soil temp. COOLING ONLY — it decides whether summer soil is a
  #                             heat source (below the setpoint it is a sink, so below-grade
  #                             surfaces add no cooling load). HEATING does not read it: below-grade
  #                             walls + slab carry the FULL outdoor ΔT, with the soil path living in
  #                             their effective U-value below.
infiltration:
  ach: 0.5                    # whole-house air changes/hour (estimate; blower-door later)
assemblies:                   # U-value, BTU/(hr*ft^2*F), per surface category
  #
  # BELOW GRADE (`basement_wall`, `floor`) TAKES AN *EFFECTIVE* U — the construction PLUS the
  # resistance of the soil path out to grade — because Eldr loads these at the full outdoor
  # design ΔT, the Manual J way. Effective U therefore FALLS as average depth below grade rises
  # (longer soil path): a certified report lists bare 8" stone/brick at U-0.293 at 3 ft average
  # depth and U-0.297 at 4 ft, where the masonry alone is nearer U-1.0. Take yours from the
  # Manual J below-grade tables (by construction AND average depth), not from an assembly
  # calculator. A bare-wall U here silently OVERSTATES the heating load. Eldr applies one value
  # per category whatever the depth, and has no grade line — every basement-level wall is
  # `basement_wall` full height — so average both in by hand. `design.ground_temp_f` is not a
  # substitute: heating never reads it.
  exterior_wall: 0.09         # 2x4 + R-13-ish
  basement_wall: 0.20         # 8in cinderblock: EFFECTIVE below-grade U, soil path included
  window: 0.30                # double-pane
  door: 0.40
  ceiling: 0.026              # attic floor, well insulated
  floor: 0.05                 # slab on grade: EFFECTIVE whole-area U, soil path included (the real
  #                             loss is perimeter-edge, so the whole-area number is deliberately tiny)
  # buffer_wall: 0.09         # wall to a garage/crawlspace; unset -> borrows `exterior_wall`
  # buffer_floor: 0.521       # framed floor over a crawl/garage, or over an UNDRAWN space.
  #                             # Unset -> borrows `exposed_floor`, then `floor` — and a slab's
  #                             # effective U is an order of magnitude off a framed floor's, so
  #                             # declare this one. Every borrow warns and is named in the report.
  # exposed_floor: 0.076      # FRAMED floor over open air (cantilever/overhang) — R-13 between
  #                             # joists, deliberately NOT the slab's 0.05 above: that is the very
  #                             # confusion the borrow warning is about. Loaded at the FULL outdoor
  #                             # ΔT, not a buffer fraction. PROVISIONAL: nothing infers it —
  #                             # reachable only via `levels.<name>.below_void: outdoor`.
equipment:                    # optional — enables the Manual S existing-unit check
  existing_tons: 4.0          # current unit nominal tonnage (omit to skip the comparison)
cooling:                      # optional — enables the Manual J 1b cooling load
  indoor_f: 75                # summer setpoint
  # outdoor_1_f:              # omitted -> looked up from lat/long (set to override)
  shgc: 0.35                  # window solar heat gain coefficient (double-pane, low-e-ish)
  occupants: 3                # for internal + latent gains
  # attic_temp_f: 130         # design-day ATTIC AIR temp. Omitted -> a sol-air estimate,
  #                             # outdoor_1_f + 50F * 0.85 roof absorptance (133.5F on Refrhus,
  #                             # i.e. 3.66x the outdoor cooling ΔT). Flat uplift: no roof area,
  #                             # orientation, ventilation rate or radiant barrier. Set this to an
  #                             # observed value to replace it. Outranked by spaces.attic.summer_temp_f.
ducts:                        # optional — enables Manual D duct sizing
  # Runs are derived per-room from the model's rooms (Manual J 1c): one branch per
  # conditioned room + a main trunk. These settings tune that:
  friction_rate: 0.08         # in.wc/100ft — used unless a rate is derived (see below)
  unit_name: air handler      # furniture-name substring locating the unit; place one in
  #                             SH3D to get per-run lengths (unit -> room)
  fitting_factor: 1.5         # straight length -> total effective length (rough; real fittings later)
  # available_static_pressure: 0.5   # in.wc — set to DERIVE the friction rate (ASP*100 / worst run).
  #                                    # Off by default: our TEL is straight-length-only, so a derived
  #                                    # rate runs high. Turn on once you have real equivalent lengths.
  # runs:                     # optional hand-listed fallback — used only if the model has no rooms
  #   - {name: main trunk, cfm: 720}
# walls:                        # optional — explicit per-wall boundary overrides (SH3D wall id).
#                               # Untagged walls are inferred; run `--walls` to list ids + boundaries.
#   wall-<id>: {boundary: buffer}     # garage/crawl-adjacent — loaded at BUFFER_FACTOR (50%) of ΔT
#   wall-<id>: {boundary: exterior}   # force onto the envelope (fix a mis-inferred wall)
#   wall-<id>: {boundary: interior}   # force off the envelope
#   # boundary ∈ {exterior, ground, buffer, interior}. `buffer` can ONLY be set here.
# levels:                       # optional — per-level overrides, keyed by the level's SH3D NAME.
#                               # An unknown name warns (renamed or typo'd). Duplicate names are
#                               # rejected outright: an entry could not address one unambiguously.
#   Main:
#     height_ft: 8.0            # override a storey height SH3D defaulted; the report echoes which
#                               # levels used a model height and which used an override
#     below_void: crawlspace    # what an UNDRAWN space beneath this level means (default crawlspace)
#     above_void: attic         # ...and above it (default attic)
#   Overhang:
#     below_void: outdoor       # open air beneath -> `exposed_floor` at the full outdoor ΔT
#   Garage:
#     role: unconditioned       # conditioned | unconditioned | ignore. NO `buffer` role — how a
#                               # space is treated thermally is decided in `spaces:` below.
#   joist-layer:
#     role: ignore              # acknowledge a walled, roomless scaffolding level and silence its
#                               # warning; it is excluded from the conditioned volume either way
# spaces:                       # optional — temperature policy per buffer space. A surface facing a
#                               # space sees a FRACTION of the design ΔT; this is what sets it.
#                               # Precedence: observed temperature > factor > vented > built-in
#                               # default (attic/crawlspace/garage = unvented 0.5, outdoor = 1.0).
#   crawlspace:
#     winter_temp_f: 32         # an OBSERVATION, so it outranks the shorthands below
#   attic:
#     vented: false             # WINTER shorthand -> 0.5 (true -> 1.0). Note the built-in default is
#                               # already false, which diverges from ACCA's vented-attic practice.
#                               # Summer ignores this: see cooling.attic_temp_f / the sol-air estimate.
#     # summer_temp_f: 125      # an observed attic air temp; outranks cooling.attic_temp_f
#   garage:
#     factor: 0.5               # explicit fraction of the design ΔT, if no temperature was observed
